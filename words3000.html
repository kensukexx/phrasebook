<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#FF6B6B">
<meta name="referrer" content="no-referrer">
<title>英単語3000 — ツウジル</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="英単語3000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #FFF9F2; --ink: #2F3542; --ink-soft: #8395A7; --red: #FF6B6B; --blue: #4D96FF; --gold: #FFA502; --green: #20BF6B; --line: rgba(47,53,66,0.12);
  }
  *{box-sizing:border-box;}
  html{ background:#EAE3D8; }
  body{ margin:0 auto; max-width:640px; background: var(--paper);
    background-image: radial-gradient(rgba(255,107,107,0.07) 1.5px, transparent 1.5px);
    background-size: 22px 22px;
    color:var(--ink); font-family:"Zen Maru Gothic","Noto Sans JP", sans-serif; min-height:100vh; padding-bottom:40px;
    box-shadow: 0 0 40px rgba(0,0,0,0.08); }
  header{ position:relative; background: linear-gradient(135deg, #FF6B6B 0%, #FF9F43 70%, #FEC84D 100%); color:#fff; padding:18px 20px 22px; overflow:hidden; }
  header::after{ content:""; position:absolute; left:0; right:0; bottom:0; height:7px;
    background: linear-gradient(90deg, #FF6B6B, #F7B731, #20BF6B, #0FB9B1, #4D96FF, #A55EEA, #FF6FA5); }
  h1{ font-family:"Zen Maru Gothic","Noto Sans JP",sans-serif; font-weight:900; font-size:clamp(20px,6vw,26px); margin:0; letter-spacing:.02em; text-shadow:0 2px 0 rgba(0,0,0,0.08); }
  header p.sub{ margin:6px 0 0; font-size:12.5px; color:rgba(255,255,255,0.92); }

  main{ padding:16px 16px 28px; }
  /* 自動再生中、今読んでいる単語のカードへ自動スクロールすると、範囲・品詞・速度などの
     上部コントロールも一緒に画面外へ流れてしまい操作できなくなる、という指摘を受けて追加。
     一覧・テストモードの表示領域だけがスクロールし、この操作パネルは常に画面上部に残る。 */
  .w3k-sticky{ position:sticky; top:0; z-index:5; background:var(--paper); padding-top:16px; margin:-16px -16px 14px; padding-left:16px; padding-right:16px; padding-bottom:14px; box-shadow:0 8px 10px -8px rgba(47,53,66,0.15); }
  /* 詳細設定を開いたままスクロールすると、固定パネルがスマホの画面をほぼ埋めてしまい、
     単語カードがパネルの裏に隠れてタップもできなくなる（設定の行が増えた時に実際に起きた）。
     詳細設定の中身だけ高さを制限して内部スクロールさせることで、範囲・再生ボタンは常に
     見えたまま、カードを表示する領域が必ず残るようにする。
     下端をぼかしているのは、切れているのではなく「続きがある（スクロールできる）」ことを
     見た目で示すため。スマホではスクロールバーが触るまで出ないので、これが唯一の手がかりになる。 */
  #words3000CollapsibleControls{ max-height:42vh; overflow-y:auto; overscroll-behavior:contain;
    -webkit-mask-image:linear-gradient(to bottom, #000 calc(100% - 22px), transparent);
    mask-image:linear-gradient(to bottom, #000 calc(100% - 22px), transparent); }
  /* 中身が収まりきっている時は、最後の行が意味もなく薄くなるだけなのでぼかさない（JSで付け外し） */
  #words3000CollapsibleControls.fits{ -webkit-mask-image:none; mask-image:none; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-family:"Zen Maru Gothic","Noto Sans JP",sans-serif; font-size:11.5px; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:6px; }
  .field select{ width:100%; padding:10px 12px; border:1.5px solid var(--line); border-radius:8px; background:rgba(255,255,255,0.5); font-size:15px; color:var(--ink); }
  .hint{ font-size:12px; color:var(--ink-soft); margin-top:4px; line-height:1.5; }

  .filter-icon{ flex:0 0 auto; width:38px; height:34px; border-radius:12px; border:none; background:#fff; color:var(--ink-soft); font-size:14px; cursor:pointer; box-shadow:0 2px 8px rgba(47,53,66,0.08); }
  .rate-quick{ flex:0 0 auto; width:auto; padding:0 10px; font-family:"Zen Maru Gothic","Noto Sans JP",sans-serif; font-weight:700; font-size:12.5px; }
  .filter-icon.on{ background:var(--green); border-color:var(--green); color:var(--paper); }
  .filter-icon.listen-on{ background:var(--red); border-color:var(--red); color:var(--paper); }
  .w3k-playbar{ display:flex; align-items:center; gap:8px; padding:0 0 10px; }
  /* 復習が溜まっている時だけ出る誘導。範囲セレクタの中にある「今日の復習」は、別の範囲を
     選んでいると件数が見えないため、気づけるようにここへ出す。 */
  /* `display:block`を無条件に書くと、著者スタイルがブラウザ標準の`[hidden]{display:none}`に
     勝ってしまい、hidden属性を立てても消えない（実際にそれで消えない不具合を出した）。
     hiddenでない時だけ効くようにセレクタを絞る。 */
  .w3k-review-prompt:not([hidden]){ display:block; }
  .w3k-review-prompt{ width:100%; margin:-4px 0 12px; padding:10px 12px; border:1.5px solid var(--green); border-radius:10px;
    background:rgba(32,191,107,0.10); color:var(--ink); font-family:"Zen Maru Gothic","Noto Sans JP",sans-serif; font-size:13px; font-weight:700; cursor:pointer; text-align:left; }
  /* 戻るボタン。以前はヘッダー内（ページ最上部）にしか無く、自動再生でカードが自動スクロール
     すると一緒に画面外へ流れて戻れなくなる、という指摘を受けてsticky領域内に移設した。 */
  .w3k-back-btn{ display:flex; align-items:center; justify-content:center; text-decoration:none; font-weight:700; }

  /* 「最後に例文も読む」のチェックボックス。.field label は大文字化・小さめの見出し用なので、
     そちらの指定を打ち消して通常の文章として読める見た目にする。 */
  .w3k-checkbox-label{ display:flex; align-items:center; gap:6px; margin:8px 0 0; font-size:12.5px;
    letter-spacing:normal; text-transform:none; color:var(--ink); }
  .w3k-checkbox-label input{ width:16px; height:16px; flex:0 0 auto; }

  /* 学習する対象の切り替え。同じ仕組みで2つのデータを扱うので、見た目もタブ1組で済ませる。 */
  .w3k-setswitch{ display:flex; gap:8px; margin-bottom:12px; }
  .w3k-set-btn{ flex:1; padding:9px 8px; border-radius:10px; border:1.5px solid var(--line);
    background:rgba(255,255,255,0.5); font-family:"Zen Maru Gothic","Noto Sans JP",sans-serif;
    font-size:13px; font-weight:700; color:var(--ink-soft); cursor:pointer; }
  .w3k-set-btn.on{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
  body.w3k-testing .w3k-setswitch{ display:none !important; }
  /* フレーズは例文が複数あるので、1本ずつ区切る */
  .w3k-ex-one + .w3k-ex-one{ margin-top:10px; padding-top:10px; border-top:1px dashed var(--line); }

  /* 4択クイズ。自己採点だと「わかったつもり」で通してしまうので、○×が機械的に決まる形も選べる。 */
  .w3k-choices{ display:grid; gap:8px; margin-top:14px; }
  .w3k-choice{ padding:12px 14px; border:1.5px solid var(--line); border-radius:10px;
    background:#fff; font-size:15px; line-height:1.5; color:var(--ink); text-align:left; cursor:pointer; }
  .w3k-choice.correct{ border-color:var(--green); background:rgba(32,191,107,0.14); font-weight:700; }
  .w3k-choice.wrong{ border-color:var(--red); background:rgba(255,107,107,0.14); }
  .w3k-choice:disabled{ cursor:default; opacity:1; }
  .w3k-choice-mark{ float:right; margin-left:10px; }


  /* 「上のパネルが常に完全固定で表示幅を圧迫する」という指摘を受けて追加。範囲・自動再生の
     ボタンは常時表示のまま、品詞以下の詳細設定だけをこのボタンで開閉できるようにし、
     どれだけ画面を使うかを自分で調整できるようにする。 */
  .w3k-collapse-toggle{ display:block; width:100%; padding:6px; margin-bottom:2px; border:none; background:none; color:var(--blue);
    font-family:"Zen Maru Gothic","Noto Sans JP",sans-serif; font-size:12px; font-weight:700; cursor:pointer; }
  #words3000CollapsibleControls{ padding-top:10px; }
  #words3000CollapsibleControls.collapsed{ display:none; }

  .w3k-optionrow{ display:flex; gap:8px; margin-bottom:14px; }
  .chip-toggle{ flex:1; padding:9px 10px; border:1.5px solid var(--line); border-radius:999px; background:#fff; color:var(--ink-soft);
    font-family:"Zen Maru Gothic","Noto Sans JP",sans-serif; font-size:12.5px; font-weight:700; cursor:pointer; }
  .chip-toggle.on{ background:var(--green); border-color:var(--green); color:#fff; }

  .searchwrap{ margin-bottom:6px; }
  .searchwrap input{ width:100%; padding:10px 12px; border:1.5px solid var(--line); border-radius:8px; background:rgba(255,255,255,0.5); font-size:15px; color:var(--ink); }

  .mini-btn{ width:24px; height:24px; border-radius:50%; border:1.5px solid var(--line); background:transparent; color:var(--ink-soft);
    font-size:12px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
  .mini-btn.done{ background:var(--green); border-color:var(--green); color:var(--paper); }
  .mini-btn.playing{ background:var(--red); border-color:var(--red); color:var(--paper); }

  .w3k-card{ border:1.5px solid var(--line); border-radius:12px; padding:14px; margin-bottom:10px; background:#fff; }
  .w3k-card.learned{ border-color:var(--green); }
  /* 自動再生中の1枚。枠だけだと「どれか」は分かっても「読める」ようにはならないので、
     今鳴っている単語そのものを大きくする。自動再生は再生中のカードをパネルのすぐ下へ
     スクロールさせるため、大きい文字は常に画面の同じ位置に出る。 */
  .w3k-card.now-playing{ box-shadow:0 0 0 3px rgba(255,107,107,0.5), 0 4px 16px rgba(47,53,66,0.12); }
  /* 大きくした単語は2列（単語｜意味）のままだと意味の列に食い込む（実際に
     "interesting"が意味に重なった）。再生中だけ縦積みにして、単語を1行まるごと使う。 */
  .w3k-card.now-playing .w3k-word-wrap{ flex-direction:column; gap:4px; }
  .w3k-card.now-playing .w3k-word-col{ max-width:100%; }
  .w3k-card.now-playing .w3k-word{ font-size:30px; line-height:1.15; word-break:break-word; }
  .w3k-card.now-playing .w3k-kana{ font-size:15px; margin-top:2px; }
  .w3k-card.now-playing .w3k-ja-front{ font-size:16px; font-weight:700; }
  .w3k-card.now-playing .w3k-pos{ font-size:12px; }
  .w3k-front{ display:flex; align-items:center; gap:10px; cursor:pointer; }
  .w3k-rank{ flex:0 0 auto; width:30px; font-family:"Zen Maru Gothic","Noto Sans JP",sans-serif; font-size:11px; color:var(--ink-soft); }
  /* 単語・カナ（左）と、意味・例文（右）を横並びにして、短い単語の右側に空く余白を
     例文の表示に使う（「右側に余白あるから右に例文配置すれば」という要望で追加）。 */
  .w3k-word-wrap{ flex:1; min-width:0; display:flex; align-items:flex-start; gap:10px; }
  .w3k-word-col{ flex:0 1 auto; max-width:40%; }
  .w3k-meaning-col{ flex:1; min-width:0; }
  .w3k-word{ font-size:17px; font-weight:700; color:var(--ink); }
  .w3k-pos{ font-size:11px; color:var(--ink-soft); margin-left:6px; }
  .w3k-kana{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .w3k-ja-front{ font-family:"Zen Maru Gothic","Noto Sans JP",sans-serif; font-size:12.5px; color:var(--ink); }
  .w3k-ex-front{ font-size:11px; color:var(--ink-soft); margin-top:3px; line-height:1.4; }
  .w3k-ex-ja-front{ font-family:"Zen Maru Gothic","Noto Sans JP",sans-serif; font-size:11px; color:var(--ink-soft); margin-top:2px; line-height:1.4; }
  .w3k-btns{ flex:0 0 auto; display:flex; gap:6px; align-items:center; }
  .w3k-btns .mini-btn.done{ background:var(--green); color:#fff; border-color:var(--green); }
  .w3k-back{ display:none; margin-top:12px; padding-top:12px; border-top:1px dashed var(--line); }
  .w3k-card.revealed .w3k-back{ display:block; }
  .w3k-ja{ font-family:"Zen Maru Gothic","Noto Sans JP",sans-serif; font-weight:700; font-size:15px; color:var(--ink); margin-bottom:8px; }
  .w3k-ex{ display:flex; align-items:flex-start; gap:8px; }
  .w3k-ex-text{ flex:1; min-width:0; }
  .w3k-ex-en{ font-size:13.5px; color:var(--ink); }
  .w3k-ex-kana{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; }
  .w3k-ex-ja{ font-size:12.5px; color:var(--ink-soft); margin-top:3px; }
  .w3k-ex-gloss{ margin-top:8px; padding:10px 12px; background:rgba(47,76,122,0.08); border-left:3px solid var(--blue); border-radius:0 8px 8px 0; font-family:"Noto Sans JP", sans-serif; font-size:12.5px; line-height:1.6; color:var(--ink-soft); }
  .gloss-line{ display:block; font-weight:700; color:var(--ink); }

  /* テスト中は、上部パネルから「テストに関係しないもの」を全部消す。
     範囲・再生ボタン・品詞・読み上げ順・出題形式などは出題の前に決めるもので、
     解いている最中には要らない。スマホでは、これらが画面の8割を占めていて
     問題と選択肢が同時に見えなかった。残すのは←戻ると、進捗＋テスト終了だけ。 */
  body.w3k-testing .w3k-sticky .field,
  body.w3k-testing .w3k-collapse-toggle,
  body.w3k-testing #words3000CollapsibleControls,
  body.w3k-testing .w3k-review-prompt,
  body.w3k-testing .w3k-playbar{ display:none !important; }
  .w3k-testbar{ display:flex; align-items:center; gap:12px; }
  .w3k-testbar[hidden]{ display:none; }
  .w3k-testbar-count{ flex:1 1 auto; font-size:13px; color:var(--ink-soft); font-variant-numeric:tabular-nums; }
  .w3k-testbar-exit{ flex:0 0 auto; padding:7px 14px; border:1.5px solid var(--line); border-radius:999px;
    background:#fff; color:var(--ink-soft); font-family:"Zen Maru Gothic","Noto Sans JP",sans-serif;
    font-size:12.5px; cursor:pointer; }

  .w3k-testcard{ border:1.5px solid var(--line); border-radius:16px; padding:20px; margin-bottom:12px; background:#fff; text-align:center; }
  .w3k-testrank{ font-size:11px; color:var(--ink-soft); margin-bottom:6px; }
  .w3k-testword{ font-size:38px; font-weight:900; color:var(--ink); line-height:1.15; word-break:break-word; }
  .w3k-testpos{ font-size:12px; color:var(--ink-soft); margin-top:6px; }
  .w3k-testkana{ font-size:14px; color:var(--ink-soft); margin-top:4px; }
  .w3k-testcard .mini-btn{ margin:12px auto 0; width:36px; height:36px; font-size:16px; }
  .w3k-testanswer{ margin-top:18px; padding-top:18px; border-top:1px dashed var(--line); text-align:left; }
  /* 4択の答え合わせは選択肢の下に別カードで出すので、上の区切り線は要らない */
  .w3k-answercard{ padding:16px 18px; margin-top:12px; }
  .w3k-answercard .w3k-testanswer{ margin-top:0; padding-top:0; border-top:none; }
  .w3k-testbtns{ display:flex; gap:10px; margin-bottom:10px; }
  .w3k-testbtns button{ flex:1; padding:13px; border:none; border-radius:12px; font-family:"Zen Maru Gothic","Noto Sans JP",sans-serif; font-weight:700; font-size:14px; cursor:pointer; }
  #testShowBtn, #testContinueBtn{ background:var(--ink); color:#fff; }
  #testWrongBtn{ background:#fff; border:1.5px solid var(--red); color:var(--red); }
  #testRightBtn{ background:var(--green); color:#fff; }
  .w3k-testnav{ display:flex; gap:10px; justify-content:space-between; margin-top:14px; }
  .w3k-testnav button{ flex:0 0 auto; padding:8px 14px; border:1.5px solid var(--line); border-radius:999px; background:#fff; color:var(--ink-soft); font-family:"Zen Maru Gothic","Noto Sans JP",sans-serif; font-size:12.5px; cursor:pointer; }
  .w3k-testnav button:disabled{ opacity:0.4; cursor:default; }
  .w3k-test-done{ text-align:center; padding:30px 10px; color:var(--ink-soft); }
</style>
</head>
<body>

<header>
  <h1 id="w3kTitle">📚 英単語3000</h1>
  <p class="sub" id="w3kSub">日常会話の9割をカバーすると言われる頻出語を、使用頻度順に学べます。</p>
</header>

<main>
  <div class="w3k-setswitch" id="words3000SetSwitch">
    <button class="w3k-set-btn on" data-set="words">📚 英単語3000</button>
    <button class="w3k-set-btn" data-set="phrases">🗣️ フレーズ100</button>
  </div>
  <div class="w3k-sticky">
    <div class="field">
      <label>範囲</label>
      <select id="words3000TierSel"></select>
    </div>
    <button class="w3k-review-prompt" id="words3000ReviewPrompt" hidden></button>
    <div class="w3k-playbar">
      <a class="filter-icon w3k-back-btn" href="./index.html" aria-label="フレーズ帳に戻る" title="フレーズ帳に戻る">←</a>
      <button class="filter-icon" id="words3000ListenBtn" aria-label="自動再生" title="この範囲を自動再生" style="width:44px;">▶</button>
      <button class="filter-icon rate-quick" id="words3000RateBtn" aria-label="スピード" title="タップで速度を切り替え">1.0x</button>
      <button class="filter-icon" id="words3000LoopBtn" aria-label="ループ再生" title="ループ再生">🔁</button>
      <button class="filter-icon" id="words3000ShuffleBtn" aria-label="ランダム再生" title="ランダムな順番で再生">🔀</button>
    </div>
    <div class="w3k-testbar" id="words3000TestBar" hidden>
      <a class="filter-icon w3k-testbar-back" href="./index.html" aria-label="フレーズ帳に戻る" title="フレーズ帳に戻る">←</a>
      <span class="w3k-testbar-count" id="words3000TestCount"></span>
      <button class="w3k-testbar-exit" id="words3000TestExitBtn">✕ テストを終える</button>
    </div>
    <button class="w3k-collapse-toggle" id="words3000CollapseToggle" aria-expanded="true">詳細設定 ▾</button>
    <div id="words3000CollapsibleControls">
      <div class="field">
        <label id="words3000PosLabel">品詞</label>
        <select id="words3000PosSel"></select>
      </div>
      <div class="field">
        <label>自動再生の読み上げ順</label>
        <select id="words3000ReadOrderSel"></select>
        <label class="w3k-checkbox-label"><input type="checkbox" id="words3000ExampleToggle"> 最後に例文も読む（英文 → 和訳）</label>
      </div>
      <div class="field">
        <label>テストの出題形式</label>
        <select id="words3000TestFormatSel">
          <option value="self">自己採点（こたえを見て ✓／❌）</option>
          <option value="choice">4択クイズ（○×が自動で決まる）</option>
        </select>
      </div>
      <div class="w3k-optionrow">
        <button class="chip-toggle" id="words3000UnlearnedBtn" aria-label="未習得のみ表示">未習得のみ</button>
        <button class="chip-toggle" id="words3000TestModeBtn" aria-label="テストモード">📝 テストモード</button>
      </div>
      <div class="searchwrap">
        <input type="text" id="words3000Search" placeholder="単語 or 日本語で検索">
      </div>
      <p class="hint" id="words3000Progress" style="margin-bottom:0;"></p>
    </div>
  </div>
  <div id="words3000List"></div>
  <div id="words3000TestArea" hidden></div>
</main>

<script src="./words3000-data.js"></script>
<script src="./phrases100-data.js"></script>
<script>
// --- localStorageの薄いラッパー。index.html（フレーズ帳本体）と同一オリジン・同一キーを
// 直接読み書きすることで、Firebase同期を含む状態をこのページ単独でも共有する。 ---
const store = {
  async get(key){ const v = localStorage.getItem(key); return v===null ? null : { value:v }; },
  async set(key, value){ localStorage.setItem(key, value); }
};
async function safeSet(key, value){
  for(let attempt=0; attempt<2; attempt++){
    try{ await store.set(key, value); return; }
    catch(e){
      if(attempt===0){ await new Promise(r=>setTimeout(r,300)); }
      else{ console.error("storage save failed after retry:", key, e); }
    }
  }
}
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

// --- 設定：フレーズ帳本体と同じ`phrasebook-settings`を共有する。このページが使うのは
// rate/listenLoop/listenGapのみだが、書き込み時は他のフィールド（fsScale等、
// フレーズ帳側が使う設定）を壊さないよう、必ず読み込み→該当フィールドだけ上書き→書き込む。 ---
let rate = 1.0;
let listenLoop = false;
let listenGap = 450;
let geminiApiKey = "";
let wordsLearned = {};
const RATE_QUICK_PRESETS = [0.75, 1.0, 1.25, 1.5, 1.75, 2.0];

async function loadState(){
  try{
    const s = await store.get('phrasebook-settings');
    if(s && s.value){
      const p = JSON.parse(s.value);
      rate = p.rate || 1.0;
      listenLoop = !!p.listenLoop;
      listenGap = (p.listenGap !== undefined) ? p.listenGap : 450;
      geminiApiKey = p.geminiApiKey || "";
    }
  }catch(e){}
  try{
    const wl = await store.get('phrasebook-words-learned');
    if(wl && wl.value){ wordsLearned = JSON.parse(wl.value); }
  }catch(e){}
  try{
    const ws = await store.get('phrasebook-word-stats');
    if(ws && ws.value){ wordStats = JSON.parse(ws.value); }
  }catch(e){}
  try{
    const sl = await store.get('phrasebook-study-log');
    if(sl && sl.value){ studyLog = JSON.parse(sl.value); }
  }catch(e){}
}
async function saveSharedSetting(fields){
  let current = {};
  try{
    const s = await store.get('phrasebook-settings');
    if(s && s.value) current = JSON.parse(s.value);
  }catch(e){}
  await safeSet('phrasebook-settings', JSON.stringify({ ...current, ...fields }));
}
async function saveWordsLearned(){ await safeSet('phrasebook-words-learned', JSON.stringify(wordsLearned)); }

// --- 学習する対象（英単語3000 / 日常英会話フレーズ100）---
// 2つのデータは同じ形（rank/word/pos/kana/ja/ex）にそろえてあるので、
// このページの仕組み（自動再生・テスト・4択・間隔反復・苦手リスト・継続の記録・同期）は
// そのまま両方に効く。**直接 activeItems() を見ないこと。**必ず activeItems() を通す。
const STUDY_SETS = {
  words: { title:"📚 英単語3000", unit:"語", itemLabel:"単語", filterLabel:"品詞", tierSize:500, data:()=>WORDS3000,
    sub:"日常会話の9割をカバーすると言われる頻出語を、使用頻度順に学べます。" },
  phrases: { title:"🗣️ 日常英会話フレーズ100", unit:"フレーズ", itemLabel:"フレーズ", filterLabel:"用途", tierSize:25, data:()=>PHRASES100,
    sub:"「〜したい」「〜してもらえますか」など、入れ替えて使える型を100。各3つの例文つきです。" },
};
let activeSet = "words";
function currentSet(){ return STUDY_SETS[activeSet] || STUDY_SETS.words; }
// 対象を切り替える。絞り込みもテストも再生も、対象が変われば全部やり直す必要がある。
function setStudySet(key){
  if(!STUDY_SETS[key] || key === activeSet) return;
  stopWords3000Listening();
  words3000PausedState = null;          // 前の対象の続きは意味を持たない
  activeSet = key;
  applyStudySetHeader();
  document.getElementById("words3000Search").value = "";
  populateWords3000TierSelect();
  populateWords3000PosSelect("");
  document.getElementById("words3000TierSel").selectedIndex = 0;
  if(testMode) startTestMode(); else renderWords3000List();
  saveW3kPrefs();
}
function activeItems(){ return currentSet().data(); }
// 見出し・説明・切り替えボタンの見た目を、いまの対象に合わせる
function applyStudySetHeader(){
  const set = currentSet();
  document.getElementById("w3kTitle").textContent = set.title;
  document.getElementById("w3kSub").textContent = set.sub;
  document.title = set.title.replace(/^\S+\s*/, "") + " — ツウジル";
  document.querySelectorAll(".w3k-set-btn").forEach(b=> b.classList.toggle("on", b.dataset.set === activeSet));
}

// 例文は英単語3000が1つ、フレーズ100が複数。どちらも受けられるようにしておく。
// （型は「穴に何を入れるか」が肝なので、フレーズ側は複数ないと型に見えない）
function allEx(w){ return Array.isArray(w.ex) ? w.ex : (w.ex ? [w.ex] : []); }
function mainEx(w){ return allEx(w)[0] || { en:"", kana:"", ja:"", gloss:"" }; }

// --- 苦手リストと継続の記録 ---
// wordsLearnedの値に相乗りさせることはできない。あの値は「truthyなら覚えた」という判定に
// アプリ全体が依存しているため、間違えただけの未習得語を入れると「覚えた」扱いになってしまう。
// そのため別キーにするが、**index.htmlのpushはmerge無しの全体上書き**なので、向こうにも
// 同じフィールドを持たせておかないとフレーズ帳を開いた瞬間に消える（getSyncableState参照）。
//
// どちらの値も増える一方にしてある。これは同期のマージを「大きいほうを採用」で済ませるため。
// 端末ごとに別々に数えた分は合算されず取りこぼすが、順位づけが目的なので実害がない。
// 逆に合計すると、同じ回答が両端末に伝わったときに二重に数えてしまう。
let wordStats = {};   // { 単語: {miss, ok} }
let studyLog = {};    // { "YYYY-MM-DD": その日に答えた語数 }
async function saveWordStats(){ await safeSet('phrasebook-word-stats', JSON.stringify(wordStats)); }
async function saveStudyLog(){ await safeSet('phrasebook-study-log', JSON.stringify(studyLog)); }

// ✓/❌・4択の正誤を1件記録する。苦手リストと「今日やった語数」の両方がここを通る。
function recordAnswer(word, correct){
  const s = wordStats[word] || { miss:0, ok:0 };
  if(correct) s.ok++; else s.miss++;
  wordStats[word] = s;
  const today = dateKey(new Date());
  studyLog[today] = (studyLog[today] || 0) + 1;
  saveWordStats();
  saveStudyLog();
}
// 苦手＝間違えた回数が正解した回数を上回っている単語。正解を重ねれば自然に外れる。
function isWeakWord(word){ const s = wordStats[word]; return !!s && s.miss > s.ok; }
function weakScore(word){ const s = wordStats[word]; return s ? (s.miss - s.ok) : 0; }
function countWeakWords(){ return activeItems().reduce((n,w)=> n + (isWeakWord(w.word) ? 1 : 0), 0); }

// 連続学習日数。今日まだ何もしていない場合は昨日から数える（朝ひらいた時に
// 「0日」と出てせっかくの連続が途切れたように見えるのを避けるため）。
function studyStreak(){
  const d = new Date();
  if(!studyLog[dateKey(d)]) d.setDate(d.getDate() - 1);
  let n = 0;
  while(studyLog[dateKey(d)]){ n++; d.setDate(d.getDate() - 1); }
  return n;
}
function todayStudyCount(){ return studyLog[dateKey(new Date())] || 0; }
// 進捗行の末尾に足す継続の表示。まだ一度も答えていないうちは何も出さない
// （0日・0語と出ても励みにならないため）。
function studyStatusText(){
  const streak = studyStreak();
  const today = todayStudyCount();
  const parts = [];
  if(streak > 0) parts.push(`🔥 ${streak}日連続`);
  if(today > 0) parts.push(`今日 ${today}${currentSet().unit}`);
  return parts.length ? `　・　${parts.join('　・　')}` : "";
}

// 同期のマージ：どちらも増える一方なので、キーごとに大きいほうを採る。
function mergeWordStats(cloud, local){
  const merged = {};
  for(const key of new Set([...Object.keys(cloud || {}), ...Object.keys(local || {})])){
    const c = (cloud || {})[key] || {}, l = (local || {})[key] || {};
    merged[key] = { miss: Math.max(c.miss || 0, l.miss || 0), ok: Math.max(c.ok || 0, l.ok || 0) };
  }
  return merged;
}
function mergeStudyLog(cloud, local){
  const merged = { ...(cloud || {}) };
  for(const [day, n] of Object.entries(local || {})) merged[day] = Math.max(merged[day] || 0, n || 0);
  return merged;
}

// --- 間隔反復（忘れかけた頃に復習する）---
// 「覚えても定着しない」という相談を受けて追加。覚えた直後ではなく、少しずつ間隔を空けて
// 復習した方が長期記憶に残る、という考え方に沿って、単語ごとに次の復習日を持たせる。
//
// 【データの持ち方】wordsLearnedは元々`{単語: true}`だったが、`{単語: {step, due}}`という
// オブジェクトも入るようにした。**どちらもtruthyなので「覚えたかどうか」を見ている既存の
// 判定（`!!wordsLearned[w.word]`・`!wordsLearned[w.word]`・`delete`）は一切変更不要**で、
// 端末間同期（getSyncableState/applyCloudStateのマージ、words3000.html側のpush）も
// 同じキー・同じフィールドのままなので手を加えなくてよい、という点を重視した設計。
// 旧データ（値がtrueのまま）は「まだ一度も復習していない＝今日が復習日」として扱う。
const SRS_INTERVAL_DAYS = [1, 3, 7, 14, 30, 60];
function dateKey(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function srsEntryFor(word){
  const v = wordsLearned[word];
  if(!v) return null;
  if(v === true) return { step:0, due:"1970-01-01" }; // 旧データ：復習日が無いので常に「今日ぶん」に含める
  return v;
}
function isDueForReview(word){
  const e = srsEntryFor(word);
  return !!e && e.due <= dateKey(new Date());
}
function countDueWords(){
  return activeItems().reduce((n,w)=> n + (isDueForReview(w.word) ? 1 : 0), 0);
}
// --- クラウドとローカルで「覚えた」状態を突き合わせる ---
// 単純な和集合（{...cloud, ...local}＝ローカル優先）では駄目だった。同じ単語について、
// 別の端末で復習して先に延びた予定を、この端末に残っていた古い予定が上書きしてしまい、
// **その単語が毎日「今日の復習」に出続ける**（実際に報告された不具合）。
// 復習は先へ進む方向にしか動かないので、予定日が後のほう＝進んでいるほうを採用する。
// なお削除（未習得に戻す）は和集合では伝わらない。これは分離前からの仕様上の制約。
function srsDueOf(v){ return v === true ? "1970-01-01" : ((v && v.due) || "1970-01-01"); }
function mergeWordsLearned(cloud, local){
  const merged = { ...(cloud || {}) };
  for(const [word, localVal] of Object.entries(local || {})){
    const cloudVal = merged[word];
    if(!cloudVal || srsDueOf(localVal) >= srsDueOf(cloudVal)) merged[word] = localVal;
  }
  return merged;
}
function wordsLearnedDiffers(a, b){
  const ka = Object.keys(a || {}), kb = Object.keys(b || {});
  if(ka.length !== kb.length) return true;
  return ka.some(k => JSON.stringify(a[k]) !== JSON.stringify((b || {})[k]));
}

// 正解した時：1段階進めて、次の復習日を先に延ばす（1日→3日→7日→14日→30日→60日）。
function advanceSrs(word){
  const prev = srsEntryFor(word);
  const step = prev ? Math.min(prev.step + 1, SRS_INTERVAL_DAYS.length - 1) : 0;
  const due = new Date();
  due.setDate(due.getDate() + SRS_INTERVAL_DAYS[step]);
  wordsLearned[word] = { step, due: dateKey(due) };
}

// --- 末尾の端末間同期モジュール（type="module"のscript）から呼ばれる橋渡し関数。
// let宣言のwordsLearnedはwindowに乗らずモジュール側から直接読み書きできないため、
// クラシックスクリプト側に用意する（index.html本体のapplyCloudStateと同じ理由）。
// これが無いと、このページ単独で「覚えた」にした単語は、後でindex.htmlを開き直さない限り
// 一切クラウドに届かない（index.html側の保存関数を一切経由しないため）——実際に
// 「スマホとPCで同期されてない」という報告のもう一つの原因だった。
function getWordsLearnedSnapshot(){ return wordsLearned; }
async function applyCloudWordsLearned(cloudWordsLearned, cloudWordStats, cloudStudyLog){
  const merged = mergeWordsLearned(cloudWordsLearned, wordsLearned);
  let needsPush = wordsLearnedDiffers(merged, cloudWordsLearned);
  wordsLearned = merged;
  await safeSet('phrasebook-words-learned', JSON.stringify(wordsLearned));

  if(cloudWordStats){
    const mergedStats = mergeWordStats(cloudWordStats, wordStats);
    if(JSON.stringify(mergedStats) !== JSON.stringify(cloudWordStats)) needsPush = true;
    wordStats = mergedStats;
    await saveWordStats();
  }
  if(cloudStudyLog){
    const mergedLog = mergeStudyLog(cloudStudyLog, studyLog);
    if(JSON.stringify(mergedLog) !== JSON.stringify(cloudStudyLog)) needsPush = true;
    studyLog = mergedLog;
    await saveStudyLog();
  }
  renderWords3000List();
  return needsPush;
}
function getWordStatsSnapshot(){ return wordStats; }
function getStudyLogSnapshot(){ return studyLog; }

// --- このページ独自の表示設定（品詞フィルタ・未習得のみ・ランダム再生・自動再生の
// 英語/日本語くり返し回数）。フレーズ帳本体は関知しない項目のため、共有のphrasebook-settingsとは
// 別の専用キーに保存する（settings側に混ぜると、index.htmlのsaveSettings()が自分の知らない
// フィールドごと書き換えて消してしまう）。テストモードかどうかは永続化しない（開くたびに
// 一覧モードから始まる方がわかりやすいため）。 ---
let unlearnedOnly = false;
let testFormat = "self";   // "self"（自己採点）か "choice"（4択）
let shuffleListen = false;
let testMode = false;
let readExample = false;
// 詳細設定パネルの開閉。スマホだと開いたままでは画面の6割近くを占めて単語が2枚半しか
// 見えないため、閉じた状態も記憶して次に開いた時もそのままにする。
let controlsCollapsed = false;
function applyControlsCollapsed(){
  document.getElementById("words3000CollapsibleControls").classList.toggle("collapsed", controlsCollapsed);
  const btn = document.getElementById("words3000CollapseToggle");
  btn.textContent = controlsCollapsed ? "詳細設定 ▸" : "詳細設定 ▾";
  btn.setAttribute("aria-expanded", String(!controlsCollapsed));
  updateScrollPadding();
}

// ブラウザ標準のscrollIntoView（アンカー移動や自動化ツールの自動スクロールを含む）は
// sticky要素の存在を知らないため、そのままだと対象が固定パネルの裏に着地してしまう。
// scroll-padding-topにパネルの高さを入れておくと、その種のスクロールが必ずパネルの
// 下に着地する。自前のscrollBelowSticky()と同じ補正を、標準の仕組み側にも効かせるもの。
function updateScrollPadding(){
  const el = document.querySelector(".w3k-sticky");
  document.documentElement.style.scrollPaddingTop = (el ? el.offsetHeight + 12 : 0) + "px";
  // 詳細設定が高さ制限に当たっていない（全部見えている）ときは、下端をぼかす必要がない
  const box = document.getElementById("words3000CollapsibleControls");
  if(box) box.classList.toggle("fits", box.scrollHeight <= box.clientHeight + 1);
}
window.addEventListener("resize", updateScrollPadding);

// --- 自動再生の読み上げ順 ---
// 元は「英語×N回」「日本語×M回」という2つの数値で指定していたが、実際にどの順番で読まれるか
// （まとめて英英和なのか、交互に英和英和なのか）がUIから読み取れない、という指摘を受けて
// 「順番そのものを選ぶ」形に作り替えた。値は "en,ja,en" のような読み上げ順をそのまま表した
// 文字列で、これを分解するだけで再生キューになる。
const READ_ORDER_PRESETS = [
  { value:"en",          label:"英語" },
  { value:"en,en",       label:"英語 → 英語" },
  { value:"en,ja",       label:"英語 → 日本語" },
  { value:"en,en,ja",    label:"英語 → 英語 → 日本語" },
  { value:"en,ja,en",    label:"英語 → 日本語 → 英語" },
  { value:"en,ja,en,ja", label:"英語 → 日本語 → 英語 → 日本語" },
  { value:"ja,en",       label:"日本語 → 英語（意味から英語を思い出す）" },
  { value:"ja,en,en",    label:"日本語 → 英語 → 英語" },
];
let readOrder = "en";
async function loadW3kPrefs(){
  let saved = {};
  try{
    const p = await store.get('phrasebook-words3000-prefs');
    if(p && p.value) saved = JSON.parse(p.value);
  }catch(e){}
  unlearnedOnly = !!saved.unlearnedOnly;
  shuffleListen = !!saved.shuffleListen;
  readExample = !!saved.readExample;
  controlsCollapsed = !!saved.controlsCollapsed;
  testFormat = saved.testFormat === "choice" ? "choice" : "self";
  // URLで指定があればそれを優先する（ツールメニューから直接フレーズで開けるように）
  const urlSet = new URLSearchParams(location.search).get("set");
  activeSet = STUDY_SETS[urlSet] ? urlSet : (STUDY_SETS[saved.activeSet] ? saved.activeSet : "words");
  readOrder = normalizeReadOrder(saved);
  return saved.posFilter || "";
}
// 旧形式（enReps/jaReps）で保存されていた設定を、同じ読み上げ順を表す新形式へ読み替える。
// 一覧に無い組み合わせ（英語3回など）だった場合は、いちばん近い「英語 → 日本語」に寄せる。
function normalizeReadOrder(saved){
  if(saved.readOrder && READ_ORDER_PRESETS.some(p=>p.value === saved.readOrder)) return saved.readOrder;
  if(saved.enReps > 0 || saved.jaReps > 0){
    const legacy = [
      ...Array(Math.max(saved.enReps|0, 0)).fill("en"),
      ...Array(Math.max(saved.jaReps|0, 0)).fill("ja"),
    ].join(',');
    if(READ_ORDER_PRESETS.some(p=>p.value === legacy)) return legacy;
    return "en,ja";
  }
  return "en";
}
async function saveW3kPrefs(){
  const posFilter = document.getElementById("words3000PosSel").value;
  await safeSet('phrasebook-words3000-prefs', JSON.stringify({ posFilter, unlearnedOnly, shuffleListen, readOrder, readExample, controlsCollapsed, testFormat, activeSet }));
}

// --- 音声合成：3段階フォールバック（①Google翻訳→②Geminiキー設定時はGemini→③端末TTS）。
// このページでは英語(en-US)と日本語(ja-JP、聞き流し中の意味読み上げ用)の2言語しか
// 使わないため、フレーズ帳本体のLANGS/voiceMap/pickVoice(langKey)による多言語対応は
// 持ち込まず、pickVoiceByPrefixだけを使う簡略版にしている。 ---
let synth = window.speechSynthesis;
let availableVoices = [];
function refreshVoices(){ availableVoices = synth ? synth.getVoices() : []; }
if(synth){ refreshVoices(); synth.onvoiceschanged = refreshVoices; }

let currentUtter = null;
let currentTTSAudio = null;
let currentPlayingBtn = null;

function voiceQualityScore(v){
  const n = v.name.toLowerCase();
  let s = 0;
  if(n.includes("natural")) s += 5;
  if(n.includes("neural")) s += 5;
  if(n.includes("online")) s += 4;
  if(n.includes("premium")) s += 4;
  if(n.includes("enhanced")) s += 3;
  if(n.includes("google")) s += 2;
  if(n.includes("compact")) s -= 3;
  if(n.includes("microsoft") && n.includes("desktop")) s -= 1;
  return s;
}
function pickVoiceByPrefix(prefix){
  const candidates = availableVoices.filter(v=>v.lang && v.lang.toLowerCase().startsWith(prefix));
  if(candidates.length===0) return null;
  return candidates.slice().sort((a,b)=>voiceQualityScore(b)-voiceQualityScore(a))[0];
}

function splitForTTS(text, maxLen){
  if(text.length <= maxLen) return [text];
  const parts = [];
  let remaining = text.trim();
  while(remaining.length > maxLen){
    let cut = remaining.lastIndexOf(' ', maxLen);
    if(cut <= 0) cut = maxLen;
    parts.push(remaining.slice(0, cut));
    remaining = remaining.slice(cut).trim();
  }
  if(remaining) parts.push(remaining);
  return parts;
}

const GOOGLE_TTS_URL_BUILDERS = [
  (q, tl) => "https://translate.google.com/translate_tts?ie=UTF-8&tl=" + encodeURIComponent(tl) + "&client=tw-ob&q=" + encodeURIComponent(q),
  (q, tl) => "https://translate.googleapis.com/translate_tts?ie=UTF-8&tl=" + encodeURIComponent(tl) + "&client=gtx&q=" + encodeURIComponent(q),
];

function playGoogleTTS(text, ttsLang, rateVal){
  return new Promise((resolve, reject)=>{
    const chunks = splitForTTS(text, 180);
    const audio = new Audio();
    currentTTSAudio = audio;
    let idx = 0;
    let hostIdx = 0;
    let settled = false;
    let hangTimer = null;
    const clearHangTimer = ()=>{ if(hangTimer){ clearTimeout(hangTimer); hangTimer = null; } };
    const fail = ()=>{
      clearHangTimer();
      const err = new Error("google tts playback failed");
      err.remainingText = chunks.slice(Math.max(idx - 1, 0)).join(" ");
      releaseAudioResources(audio);
      reject(err);
    };
    const loadChunk = ()=>{
      settled = false;
      const url = GOOGLE_TTS_URL_BUILDERS[hostIdx](chunks[idx - 1], ttsLang);
      audio.src = url;
      audio.playbackRate = rateVal || 1;
      audio.play().catch(onChunkError);
      clearHangTimer();
      hangTimer = setTimeout(()=>{ if(!settled) onChunkError(); }, 8000);
    };
    const onChunkError = ()=>{
      if(settled) return;
      settled = true;
      clearHangTimer();
      if(hostIdx + 1 < GOOGLE_TTS_URL_BUILDERS.length){
        hostIdx++;
        setTimeout(()=>{
          if(currentTTSAudio !== audio) return;
          loadChunk();
        }, 400);
      } else {
        fail();
      }
    };
    const playNext = ()=>{
      settled = true;
      clearHangTimer();
      if(idx >= chunks.length){ releaseAudioResources(audio); resolve(); return; }
      idx++;
      hostIdx = 0;
      loadChunk();
    };
    audio.onended = playNext;
    audio.onerror = onChunkError;
    playNext();
  });
}

function releaseAudioResources(audio){
  audio.removeAttribute("src");
  audio.load();
}

function pcm16ToWavBlob(base64Pcm, sampleRate, numChannels){
  const binary = atob(base64Pcm);
  const pcmBytes = new Uint8Array(binary.length);
  for(let i=0; i<binary.length; i++) pcmBytes[i] = binary.charCodeAt(i);
  const bytesPerSample = 2;
  const blockAlign = numChannels * bytesPerSample;
  const byteRate = sampleRate * blockAlign;
  const dataSize = pcmBytes.length;
  const buffer = new ArrayBuffer(44 + dataSize);
  const view = new DataView(buffer);
  const writeStr = (offset, str)=>{ for(let i=0;i<str.length;i++) view.setUint8(offset+i, str.charCodeAt(i)); };
  writeStr(0, "RIFF"); view.setUint32(4, 36 + dataSize, true); writeStr(8, "WAVE");
  writeStr(12, "fmt "); view.setUint32(16, 16, true); view.setUint16(20, 1, true);
  view.setUint16(22, numChannels, true); view.setUint32(24, sampleRate, true);
  view.setUint32(28, byteRate, true); view.setUint16(32, blockAlign, true); view.setUint16(34, 16, true);
  writeStr(36, "data"); view.setUint32(40, dataSize, true);
  new Uint8Array(buffer, 44).set(pcmBytes);
  return new Blob([buffer], { type: "audio/wav" });
}

async function playGeminiTTS(text, rateVal){
  const chunks = splitForTTS(text, 400);
  const url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-tts-preview:generateContent?key=" + encodeURIComponent(geminiApiKey);
  const audio = new Audio();
  currentTTSAudio = audio;
  for(let i=0; i<chunks.length; i++){
    const chunk = chunks[i];
    try {
      const abortController = new AbortController();
      const abortTimer = setTimeout(()=> abortController.abort(), 8000);
      let res;
      try {
        res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{ parts: [{ text: chunk }] }],
            generationConfig: { responseModalities: ["AUDIO"], speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: "Kore" } } } },
          }),
          signal: abortController.signal,
        });
      } finally {
        clearTimeout(abortTimer);
      }
      if(!res.ok) throw new Error("gemini tts failed: " + res.status);
      const data = await res.json();
      const part = data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts && data.candidates[0].content.parts[0];
      const b64 = part && part.inlineData && part.inlineData.data;
      if(!b64) throw new Error("gemini tts: no audio data in response");
      const blob = pcm16ToWavBlob(b64, 24000, 1);
      const blobUrl = URL.createObjectURL(blob);
      await new Promise((resolve, reject)=>{
        audio.src = blobUrl;
        audio.playbackRate = rateVal || 1;
        audio.onended = ()=>{ URL.revokeObjectURL(blobUrl); resolve(); };
        audio.onerror = ()=>{ URL.revokeObjectURL(blobUrl); reject(new Error("gemini tts playback failed")); };
        audio.play().catch(reject);
      });
    } catch(e){
      e.remainingText = chunks.slice(i).join(" ");
      releaseAudioResources(audio);
      throw e;
    }
  }
  releaseAudioResources(audio);
}

function stopAllAudio(){
  if(synth) synth.cancel();
  if(currentTTSAudio){
    currentTTSAudio.onended = null;
    currentTTSAudio.onerror = null;
    currentTTSAudio.pause();
    releaseAudioResources(currentTTSAudio);
    currentTTSAudio = null;
  }
  if(currentPlayingBtn){
    currentPlayingBtn.classList.remove("playing");
    currentPlayingBtn = null;
  }
}

function speakViaBrowserTTS(text, speechLang, rateVal, finish, notifyIfUnsupported){
  if(!synth){
    if(notifyIfUnsupported) alert("この端末・ブラウザは音声合成（読み上げ）に対応していないようです。SafariやChromeなど別のブラウザでお試しください。");
    finish();
    return;
  }
  const utter = new SpeechSynthesisUtterance(text);
  currentUtter = utter;
  const voice = pickVoiceByPrefix(speechLang.split('-')[0].toLowerCase());
  if(voice) utter.voice = voice;
  utter.lang = speechLang;
  utter.rate = rateVal;
  utter.onend = finish;
  utter.onerror = finish;
  synth.speak(utter);
}

function ttsLangFor(speechLang){
  return speechLang.toLowerCase().startsWith("ja") ? "ja" : "en";
}

function speakRaw(text, speechLang, btn, onDone, rateOverride){
  stopAllAudio();
  text = text.replace(/~/g, " ").replace(/\s+/g, " ").trim();
  const isJapanese = speechLang.toLowerCase().startsWith("ja");
  const rateVal = rateOverride || rate;
  if(btn){ btn.classList.add("playing"); currentPlayingBtn = btn; }
  const finish = ()=>{
    if(btn) btn.classList.remove("playing");
    if(currentPlayingBtn === btn) currentPlayingBtn = null;
    if(onDone) onDone();
  };
  const ttsLang = ttsLangFor(speechLang);
  const viaDevice = (t)=> speakViaBrowserTTS(t || text, speechLang, rateVal, finish, !!btn);
  const viaGeminiThenDevice = (err)=>{
    const remaining = (err && err.remainingText) || text;
    if(geminiApiKey && navigator.onLine !== false){
      playGeminiTTS(remaining, rateVal).then(finish).catch((e)=> viaDevice((e && e.remainingText) || remaining));
    } else {
      viaDevice(remaining);
    }
  };
  if(navigator.onLine !== false){
    playGoogleTTS(text, ttsLang, rateVal).then(finish).catch(viaGeminiThenDevice);
  } else {
    viaGeminiThenDevice();
  }
}

// --- 範囲（ティア）：対象データの実際の最大rankから動的にティア数を計算するため、
// バッチを追加していってもUI側の変更は不要。500語区切りに加え、末尾に「全◯語」を通しで
// 選べる選択肢も足す（区切りが複数ある時だけ＝1ティアしか無いなら同じ内容になるので不要）。
// 選択肢のvalueは"from-to"形式の文字列にして、全語オプションのような+499で機械的に
// 求まらない範囲も表現できるようにしている。
function words3000TierRanges(){
  const maxRank = activeItems().reduce((m,w)=>Math.max(m,w.rank), 0);
  const tierSize = currentSet().tierSize;
  const tierCount = Math.max(1, Math.ceil(maxRank / tierSize));
  const ranges = Array.from({length:tierCount}, (_,i)=>({from:i*tierSize+1, to:Math.min((i+1)*tierSize, maxRank)}));
  if(tierCount > 1){
    ranges.push({from:1, to:maxRank, all:true});
  }
  return ranges;
}
function populateWords3000TierSelect(){
  const sel = document.getElementById("words3000TierSel");
  const prev = sel.value;
  // 500語区切り・全語に加えて、末尾に「今日復習すべき単語だけ」を選べる特別な範囲を足す。
  // 既存の絞り込み（words3000FilteredList）に乗せるだけで、一覧・自動再生・テストモードの
  // すべてが復習対象だけを扱うようになる。
  sel.innerHTML = words3000TierRanges().map(r=>{
    const unit = currentSet().unit;
    const label = r.all ? `全${r.to}${unit}（1〜${r.to}${unit}）` : `${r.from}〜${r.to}${unit}`;
    return `<option value="${r.from}-${r.to}">${label}</option>`;
  }).join('')
    + `<option value="review">🔁 今日の復習（${countDueWords()}語）</option>`
    + `<option value="weak">⚠️ 苦手な単語（${countWeakWords()}語）</option>`;
  if(prev && [...sel.options].some(o=>o.value===prev)) sel.value = prev;
}
function isReviewTier(){
  return document.getElementById("words3000TierSel").value === "review";
}
function isWeakTier(){

}
// 復習の残り語数は覚えた✓を付けるたびに変わるので、選択状態を壊さずラベルだけ差し替える。
// あわせて、別の範囲を選んでいると件数に気づけないため、溜まっている時だけ誘導ボタンを出す。

// 品詞の並び順は、学習上よく目にする順（名詞・動詞・形容詞・副詞...）を優先。データに
// 無い品詞は自動的に除外し、逆にこの並びに無い未知の品詞が将来増えても取りこぼさない。
const POS_ORDER = ["名詞","動詞","形容詞","副詞","代名詞","前置詞","接続詞","数詞","助動詞","疑問詞","冠詞"];
function populateWords3000PosSelect(initialValue){
  const sel = document.getElementById("words3000PosSel");
  const present = new Set(activeItems().map(w=>w.pos).filter(Boolean));
  const ordered = POS_ORDER.filter(p=>present.has(p));
  present.forEach(p=>{ if(!ordered.includes(p)) ordered.push(p); });
  const fl = currentSet().filterLabel;
  const labelEl = document.getElementById("words3000PosLabel");
  if(labelEl) labelEl.textContent = fl;
  sel.innerHTML = `<option value="">すべての${fl}</option>` + ordered.map(p=>`<option value="${esc(p)}">${esc(p)}</option>`).join('');
  if(initialValue && ordered.includes(initialValue)) sel.value = initialValue;

// 範囲・品詞・検索・未習得のみ、すべての絞り込みを1箇所にまとめる。一覧表示・自動再生・
// テストモードの対象リストは、すべてこの関数の結果をそのまま使う。
function words3000FilteredList(){
  const tierValue = document.getElementById("words3000TierSel").value;
  const q = document.getElementById("words3000Search").value.trim().toLowerCase();
  const pos = document.getElementById("words3000PosSel").value;
  let items;
  if(tierValue === "review"){
    items = activeItems().filter(w=>isDueForReview(w.word));
  } else if(tierValue === "weak"){
    // 苦手な順（間違い超過が大きい順）に並べる。頻度順のままだと、いちばん苦戦している
    // 単語が後ろに埋もれてしまい、絞り込んだ意味が薄れるため。
    items = activeItems().filter(w=>isWeakWord(w.word)).sort((a,b)=> weakScore(b.word) - weakScore(a.word));
  } else {
    const [tierFromStr, tierToStr] = tierValue.split('-');
    const tierFrom = parseInt(tierFromStr, 10) || 1;
    const tierTo = parseInt(tierToStr, 10) || (tierFrom + 499);
    items = activeItems().filter(w=>w.rank>=tierFrom && w.rank<=tierTo);
  }
  if(pos) items = items.filter(w=>w.pos===pos);
  if(q) items = items.filter(w=> w.word.toLowerCase().includes(q) || w.ja.includes(q));
  // 復習対象は定義上すべて✓済みなので、「未習得のみ」をそのまま適用すると必ず0件になる。
  // 復習の範囲を選んでいる間はこの絞り込みを無視する。
  if(unlearnedOnly && tierValue !== "review" && tierValue !== "weak") items = items.filter(w=>!wordsLearned[w.word]);
  return items;
}
function shuffleArray(arr){
  for(let i=arr.length-1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

        </span>
        <span class="w3k-btns">
          ${reviewing
            ? `<button class="mini-btn" aria-label="思い出せた（次の復習日へ）" title="思い出せた：次の復習日を先へ延ばす" data-role="learn">✓</button>
               <button class="mini-btn" aria-label="あやふや（未習得に戻す）" title="あやふや：覚えた✓を外して未習得に戻す" data-role="forget">↺</button>`
            : `<button class="mini-btn ${isLearned?'done':''}" aria-label="覚えた" data-role="learn">✓</button>`}

// --- 自動再生（聞き流し）：フレーズ帳本体の聞き流しと同じ操作感を再現する独立版。
// 速度(rate)・フレーズ間隔(listenGap)・ループ(listenLoop)は`phrasebook-settings`を通じて
// 同じ設定を共有し、対象は現在の範囲・品詞・検索・未習得のみの絞り込み
// （words3000FilteredList()）。shuffleListenがONなら再生順もランダムにする。
// 1語ぶんの読み上げ順はこのページ専用の設定（readOrder）で、"en,ja,en" のような文字列を
// そのまま分解してキューにする。「英語→日本語→英語→日本語」のような交互も、
// 「英語→英語→日本語」のようなまとめ読みも、同じ仕組みで表せる。 ---
let words3000ListenState = { active:false, list:[], index:0 };
function updateWords3000ListenButton(){
  const btn = document.getElementById("words3000ListenBtn");
  if(words3000ListenState.active){
    btn.textContent = "■";
    btn.title = `再生中 ${words3000ListenState.index+1}/${words3000ListenState.list.length}`;
    btn.classList.add("listen-on");
  }else{
    btn.textContent = "▶";
    btn.title = "この範囲を自動再生";

}
// scrollIntoView(block:"center"等)は、範囲・品詞・速度などをまとめたsticky領域が画面上部を
// 塞いでいることを考慮しないため、そのまま使うと対象がsticky領域の裏に隠れる。sticky領域の
// 実際の高さを差し引いた位置へ手動でスクロールする。
function scrollBelowSticky(el){
  const stickyEl = document.querySelector(".w3k-sticky");
  const stickyHeight = stickyEl ? stickyEl.offsetHeight : 0;
  const targetY = window.scrollY + el.getBoundingClientRect().top - stickyHeight - 12;
  window.scrollTo({ top: Math.max(targetY, 0), behavior: "smooth" });
}
function highlightWords3000Playing(word){

  const el = document.querySelector(`.w3k-card[data-word="${CSS.escape(word)}"]`);

// queueの各要素は "en"(単語の発音)・"ja"(単語の意味)・"ex-en"(例文の英文)・"ex-ja"(例文の和訳)。
const W3K_QUEUE_TEXT = { en: w=>w.word, ja: w=>w.ja, "ex-en": w=>mainEx(w).en, "ex-ja": w=>mainEx(w).ja };
const W3K_QUEUE_LANG = { en: "en-US", ja: "ja-JP", "ex-en": "en-US", "ex-ja": "ja-JP" };
// --- バックグラウンド再生（画面ロック中・他アプリ使用中でも読み上げを続ける） ---
//
// 【前提】ブラウザを完全に閉じたあとに音を出すことはWebでは不可能。ページのプロセスが
// 終われば再生手段が無く、Service Workerには音声再生のAPIが無い。できるのは
// 「画面ロック中・他アプリに切り替えた間」までで、それ以上はネイティブアプリの領分。
//
// 【なぜ今のままだと止まるか】自動再生は「短い音声を1つ再生 → JSのコールバックと
// setTimeout で次を開始」という連鎖になっている。バックグラウンドではJSのタイマーが
// 絞られる／凍結されるため、いま鳴っている1語が終わったところで止まってしまう。
//
// 【対策】①無音を延々ループ再生して「このページはメディアを再生中」という状態を保ち、
// OSにページごと止められないようにする ②語と語のつなぎは、画面が見えていない間は
// タイマーを挟まず音声の終了イベントから直接次へ進める ③MediaSessionでロック画面に
// 操作パネルを出す。①はiOSの挙動がバージョンによって変わるため、実機での確認が要る。
let keepAliveAudio = null;
function silentWavUrl(seconds){
  const sampleRate = 8000, samples = Math.round(sampleRate * seconds);
  const buf = new ArrayBuffer(44 + samples * 2); // 16bit モノラル、中身はゼロ＝無音
  const view = new DataView(buf);
  const writeStr = (off, str)=>{ for(let i=0;i<str.length;i++) view.setUint8(off+i, str.charCodeAt(i)); };
  writeStr(0, "RIFF"); view.setUint32(4, 36 + samples*2, true); writeStr(8, "WAVE");
  writeStr(12, "fmt "); view.setUint32(16, 16, true); view.setUint16(20, 1, true);
  view.setUint16(22, 1, true); view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate*2, true); view.setUint16(32, 2, true); view.setUint16(34, 16, true);
  writeStr(36, "data"); view.setUint32(40, samples*2, true);
  return URL.createObjectURL(new Blob([buf], { type: "audio/wav" }));
}
function startKeepAlive(){
  if(keepAliveAudio) { keepAliveAudio.play().catch(()=>{}); return; }
  try{
    keepAliveAudio = new Audio(silentWavUrl(1));
    keepAliveAudio.loop = true;
    keepAliveAudio.volume = 0;   // 無音データだが、念のため音量も0にしておく
    keepAliveAudio.play().catch(()=>{}); // 自動再生が拒否されても再生自体は続ける
  }catch(e){ keepAliveAudio = null; }
}
function stopKeepAlive(){
  if(!keepAliveAudio) return;
  keepAliveAudio.pause();
  if(keepAliveAudio.src) URL.revokeObjectURL(keepAliveAudio.src);
  keepAliveAudio = null;
}
// ロック画面・通知領域の操作パネル。今どの単語を読んでいるかも出す。
function updateMediaSession(w){
  if(!("mediaSession" in navigator)) return;
  try{
    if(w){
      navigator.mediaSession.metadata = new MediaMetadata({
        title: w.word,
        artist: w.ja,
        album: `英単語3000（${words3000ListenState.index + 1} / ${words3000ListenState.list.length}）`,
      });
    }
    navigator.mediaSession.playbackState = words3000ListenState.active ? "playing" : "paused";
  }catch(e){}
}
function setupMediaSessionHandlers(){
  if(!("mediaSession" in navigator)) return;
  const set = (action, fn)=>{ try{ navigator.mediaSession.setActionHandler(action, fn); }catch(e){} };
  set("play", ()=>{ if(!words3000ListenState.active) startWords3000Listening(); });
  set("pause", ()=>{ if(words3000ListenState.active) stopWords3000Listening(); });
  set("stop", ()=>{ if(words3000ListenState.active) stopWords3000Listening(); });
  set("nexttrack", ()=> skipWords3000(1));
  set("previoustrack", ()=> skipWords3000(-1));
}
// ロック画面の送り／戻し。再生中でなければ何もしない。
function skipWords3000(delta){
  if(!words3000ListenState.active) return;
  stopAllAudio();
  const next = words3000ListenState.index + delta;
  words3000ListenState.index = Math.min(Math.max(next, 0), words3000ListenState.list.length - 1);
  playWords3000Step();
}

function playWords3000Queue(w, queue, i){
  if(!words3000ListenState.active) return;
  if(i >= queue.length){
    const advance = ()=>{
      if(!words3000ListenState.active) return;
      words3000ListenState.index++;
      playWords3000Step();
    };
    // バックグラウンドではsetTimeoutが絞られる／凍結されるため、画面が見えていない間は
    // 間隔を挟まず、音声の終了からそのまま次の語へ進める（ここで待つと止まってしまう）。
    if(document.hidden) advance(); else setTimeout(advance, listenGap);
    return;
  }
  const kind = queue[i];
  const isLastInWord = i === queue.length - 1;
  speakRaw(W3K_QUEUE_TEXT[kind](w), W3K_QUEUE_LANG[kind], null, ()=>{
    if(!words3000ListenState.active) return;
    if(isLastInWord || document.hidden){ playWords3000Queue(w, queue, i+1); }
    else { setTimeout(()=> playWords3000Queue(w, queue, i+1), Math.min(listenGap, 350)); }
  });
}
function playWords3000Step(){
  if(!words3000ListenState.active) return;
  if(words3000ListenState.index >= words3000ListenState.list.length){
    if(listenLoop){ words3000ListenState.index = 0; } else { stopWords3000Listening(); return; }
  }
  const w = words3000ListenState.list[words3000ListenState.index];
  highlightWords3000Playing(w.word);
  updateWords3000ListenButton();
  updateMediaSession(w);
  const queue = readOrder.split(',').filter(Boolean);
  if(readExample){ queue.push("ex-en"); queue.push("ex-ja"); }
  if(queue.length === 0) queue.push("en"); // 英語0回・日本語0回・例文もOFFは想定しないが、無音で止まらないための保険
  playWords3000Queue(w, queue, 0);
}
// 一時停止した続きから再生できるように、■で止めた時点のlist/indexを保持しておく
// （「1回止めて途中から再生したい」という要望）。範囲・品詞・検索・未習得のみを変更した
// 時（onWords3000FiltersChanged・各トグル）は対象の語自体が変わりうるため、この保存を
// 明示的に破棄し、次の▶では必ず最初から再生し直す。
let words3000PausedState = null;
function startWords3000Listening(){
  if(words3000PausedState && words3000PausedState.index < words3000PausedState.list.length){
    words3000ListenState = { active:true, list: words3000PausedState.list, index: words3000PausedState.index };
    words3000PausedState = null;
    startKeepAlive();
    playWords3000Step();
    return;
  }
  // 表示（一覧）は「未習得のみ」がOFFなら覚えた単語も見えたままにしておきたいが、自動再生は
  // 「覚えた単語チェック入ってるやつは読み飛ばしていい」という要望を受けて、表示フィルタとは
  // 別に常に✓済みの単語を飛ばす（「未習得のみ」がONの時はwords3000FilteredList()側で
  // 既に除外済みなので、ここでの絞り込みは実質何もしない）。ただし「今日の復習」の範囲は
  // 対象が全て✓済みなので、そこでこの絞り込みを効かせると必ず0件になってしまう＝除外する。
  let list = words3000FilteredList();
  if(!isReviewTier()) list = list.filter(w=>!wordsLearned[w.word]);
  if(list.length===0){ alert("再生できる単語がありません（範囲・検索条件を確認するか、すべて覚えた✓済みかもしれません）"); return; }
  if(shuffleListen) list = shuffleArray(list.slice());
  words3000ListenState = { active:true, list, index:0 };
  startKeepAlive();
  playWords3000Step();
}
function stopWords3000Listening(){
  if(!words3000ListenState.active) return;
  words3000ListenState.active = false;
  words3000PausedState = { list: words3000ListenState.list, index: words3000ListenState.index };
  stopAllAudio();
  stopKeepAlive();
  updateMediaSession(null);
  document.querySelectorAll(".w3k-card.now-playing").forEach(el=>el.classList.remove("now-playing"));
  updateWords3000ListenButton();
}

// --- テストモード：意味を隠したフラッシュカードを1問ずつ出題し、タップで答え合わせをする
// 能動的な復習モード。「✓ わかった」は覚えた扱いに、「❌ もう一度」は未習得のまま
// （既に覚えた✓が付いていても外す）にしてから次の問題に進む。対象は一覧と同じ絞り込み結果。 ---
let testState = { list:[], index:0, revealed:false, choices:null, picked:null };

// 4択の選択肢。誤答は同じ品詞から選ぶ（品詞が違うと意味を読まなくても消去法で当たるため）。
// 同じ意味の文字列は除く（正解と見分けがつかない選択肢ができてしまう）。
function buildTestChoices(w){
  const samePos = activeItems().filter(x => x.pos === w.pos && x.ja !== w.ja);
  const pool = samePos.length >= 3 ? samePos : activeItems().filter(x => x.ja !== w.ja);
  const used = new Set([w.ja]);
  const picked = [];
  for(let guard = 0; guard < 300 && picked.length < 3; guard++){
    const c = pool[Math.floor(Math.random() * pool.length)];
    if(!c || used.has(c.ja)) continue;
    used.add(c.ja);
    picked.push(c.ja);
  }
  return shuffleArray([w.ja, ...picked]);
}
// 次の問題へ。4択の状態も必ずここで捨てる（残ると前の問題の選択肢が出る）。
function goToTestIndex(index){
  testState.index = index;
  testState.revealed = false;
  testState.choices = null;
  testState.picked = null;
  renderTestCard(true);
}
function setWords3000Mode(mode){
  testMode = (mode === 'test');
  document.getElementById("words3000TestModeBtn").classList.toggle("on", testMode);
  document.getElementById("words3000List").hidden = testMode;
  document.getElementById("words3000Progress").hidden = testMode;
  document.getElementById("words3000TestArea").hidden = !testMode;
  // テスト中は上部パネルを「戻る＋進捗＋終了」だけに畳む（CSSはbodyのクラスで効かせる）
  document.body.classList.toggle("w3k-testing", testMode);
  document.getElementById("words3000TestBar").hidden = !testMode;
  updateScrollPadding();
  if(testMode){
    // hidden属性は視覚的に隠すだけでDOMには残るため、そのままだと一覧側の.w3k-ja等が
    // テストモード側の同名クラスと衝突する（同じ単語なら文面まで一致し得るため見た目では
    // 気づきにくい）。テスト対象に入る前に空にしておく。
    document.getElementById("words3000List").innerHTML = "";
    startTestMode();
  } else {
    stopWords3000Listening();
    renderWords3000List();
  }
}
function startTestMode(){
  stopWords3000Listening();
  let list = words3000FilteredList();
  if(shuffleListen) list = shuffleArray(list.slice());
  testState = { list, index:0, revealed:false, choices:null, picked:null };
  renderTestCard(true);
}
function setTestCount(text){
  document.getElementById("words3000TestCount").textContent = text;
}
function renderTestCard(autoSpeak){
  const area = document.getElementById("words3000TestArea");
  refreshReviewOptionLabel(); // ✓/❌のたびに「今日の復習（N語）」の残数を更新する
  if(testState.list.length === 0){
    setTestCount("");
    area.innerHTML = '<p class="hint w3k-test-done">該当する単語がありません（範囲・検索・品詞の条件を確認してください）。</p>';
    return;
  }
  if(testState.index >= testState.list.length){
    setTestCount(`${testState.list.length} / ${testState.list.length}`);
    area.innerHTML = `<div class="w3k-test-done">🎉 このセット（${testState.list.length}語）のテストが終わりました。
      <div class="w3k-testnav" style="justify-content:center; margin-top:14px;">
        <button id="testRestartBtn">もう一度</button>
      </div>
    </div>`;
    document.getElementById("testRestartBtn").addEventListener("click", ()=> goToTestIndex(0));
    return;
  }
  const w = testState.list[testState.index];
  const choiceMode = testFormat === "choice";
  if(choiceMode && !testState.choices) testState.choices = buildTestChoices(w);
  setTestCount(`${testState.index+1} / ${testState.list.length}`);
  // 答え合わせの内容（意味・例文・🔤）。4択では選択肢の「下」に出す。
  // 上に挿入すると、選択肢をタップした指の位置から結果が数百px上へ飛んでしまうため。
  const answerHtml = `
      <div class="w3k-testanswer">
        <div class="w3k-ja">${esc(w.ja)}</div>
        <div class="w3k-ex">
          <div class="w3k-ex-text">
            ${allEx(w).map(e=>`
            <div class="w3k-ex-one">
              <div class="w3k-ex-en">${esc(e.en)}</div>
              <div class="w3k-ex-kana">${esc(e.kana)}</div>
              <div class="w3k-ex-ja">${esc(e.ja)}</div>
              ${e.gloss ? `<div class="w3k-ex-gloss"><span class="gloss-line">🔤 ${esc(e.gloss)}</span></div>` : ''}
            </div>`).join('')}
          </div>
        </div>
      </div>`;
  area.innerHTML = `
    <div class="w3k-testcard">
      <div class="w3k-testrank">rank ${w.rank}</div>
      <div class="w3k-testword">${esc(w.word)}</div>
      <div class="w3k-testpos">${esc(w.pos||"")}</div>
      <div class="w3k-testkana">${esc(w.kana)}</div>
      <button class="mini-btn" id="testSpeakBtn" aria-label="発音を聞く">🔊</button>
      ${(!choiceMode && testState.revealed) ? answerHtml : ''}
    </div>
    ${choiceMode ? `
    <div class="w3k-choices">
      ${testState.choices.map(ja=>{
        const isAnswer = ja === w.ja;
        const isPicked = testState.picked === ja;
        const cls = !testState.picked ? '' : (isAnswer ? ' correct' : (isPicked ? ' wrong' : ''));
        const mark = !testState.picked ? '' : (isAnswer ? '<span class="w3k-choice-mark">✓</span>' : (isPicked ? '<span class="w3k-choice-mark">✗</span>' : ''));
        return `<button class="w3k-choice${cls}" data-ja="${esc(ja)}" ${testState.picked ? 'disabled' : ''}>${mark}${esc(ja)}</button>`;
      }).join('')}
    </div>
    ${testState.picked ? `
    <div class="w3k-testbtns"><button id="testContinueBtn">次へ →</button></div>
    <div class="w3k-testcard w3k-answercard">${answerHtml}</div>` : ''}` : `
    <div class="w3k-testbtns">
      ${testState.revealed
        ? '<button id="testWrongBtn">❌ もう一度</button><button id="testRightBtn">✓ わかった</button>'
        : '<button id="testShowBtn">こたえを見る</button>'}
    </div>`}
    <div class="w3k-testnav">
      <button id="testPrevBtn" ${testState.index===0 ? 'disabled' : ''}>← 前へ</button>
      <button id="testNextBtn">スキップ →</button>
    </div>
  `;
  document.getElementById("testSpeakBtn").addEventListener("click", (e)=> speakRaw(w.word, "en-US", e.currentTarget, null));
  // 正解/不正解の扱いは自己採点でも4択でも同じ：正解なら復習日を先へ、不正解なら未習得に戻す。
  // どちらの場合も苦手リストと「今日やった語数」に1件記録する。
  const answerWord = (correct)=>{
    recordAnswer(w.word, correct);
    if(correct) advanceSrs(w.word); else delete wordsLearned[w.word];
    saveWordsLearned();
  };
  if(choiceMode){
    area.querySelectorAll('.w3k-choice').forEach(btn=>{
      btn.addEventListener("click", ()=>{
        if(testState.picked) return;
        testState.picked = btn.dataset.ja;
        answerWord(testState.picked === w.ja);
        renderTestCard(false); // 正解を見せるためその場に留まる（「次へ」で進む）
      });
    });
    const cont = document.getElementById("testContinueBtn");
    if(cont) cont.addEventListener("click", ()=> goToTestIndex(testState.index + 1));
  } else if(testState.revealed){
    document.getElementById("testWrongBtn").addEventListener("click", ()=>{
      answerWord(false); // 不正解：覚えた✓ごと外して未習得に戻す（復習日もリセットされる）
      goToTestIndex(testState.index + 1);
    });
    document.getElementById("testRightBtn").addEventListener("click", ()=>{
      answerWord(true); // 正解：次の復習日を1段階先へ延ばす
      goToTestIndex(testState.index + 1);
    });
  } else {
    document.getElementById("testShowBtn").addEventListener("click", ()=>{
      testState.revealed = true;
      renderTestCard(false);
    });
  }
  document.getElementById("testPrevBtn").addEventListener("click", ()=>{
    if(testState.index > 0) goToTestIndex(testState.index - 1);
  });
  document.getElementById("testNextBtn").addEventListener("click", ()=>{
    goToTestIndex(testState.index + 1); // スキップ：記録も復習日も動かさない
  });
  if(autoSpeak){
    // 新しい問題に進んだ時だけ、カードの先頭がsticky領域の裏に隠れない位置へ戻す。
    // （スマホだと1問がほぼ画面の高さぶんあり、答え合わせのボタンを押すために下へ
    // スクロールした状態のまま次の問題に進むと、肝心の単語が隠れてしまうため）
    // こたえを見た時（autoSpeak=false）はスクロールしない＝読んでいる位置を動かさない。
    scrollBelowSticky(area);
    speakRaw(w.word, "en-US", document.getElementById("testSpeakBtn"), null);
  }
}

      }catch(e){ console.error("words3000 cloud push error:", e); }
    }
    function scheduleWordsLearnedPush(){
      if(!currentUser) return;
      clearTimeout(pushTimer);
      pushTimer = setTimeout(pushWordsLearned, 1200);
    }
    // index.html本体と同じ対策：デバウンス中にタブを閉じる・バックグラウンドに回すと
    // pushが一度もクラウドに届かないまま消えることがあるため、hidden化で即座に確定させる。
    document.addEventListener("visibilitychange", ()=>{
      if(document.visibilityState === "hidden" && pushTimer){
        clearTimeout(pushTimer);
        pushTimer = null;
        pushWordsLearned();
      }
    });

    // 「覚えた✓」がローカルに保存されるたびに（saveWordsLearned()呼び出しのたび）pushを予約する。
    // 苦手リスト(wordStats)・継続の記録(studyLog)も同じドキュメントに入れるので、
    // それぞれの保存関数もラップしてpushを予約する。ラップし忘れると、その項目だけが
    // 「ローカルには増えるのにクラウドへ一度も届かない」状態になる（分離直後に実際に起きた）。
    for(const name of ["saveWordsLearned", "saveWordStats", "saveStudyLog"]){
      const orig = window[name];
      window[name] = async function(...args){
        const result = await orig.apply(this, args);
        scheduleWordsLearnedPush();
        return result;
      };
    }

    onAuthStateChanged(auth, async (user)=>{
      currentUser = user;
      if(!user) return;
      // ページを開いた時点で一度だけクラウド側のwordsLearnedを取り込む。ローカル限定の
      // エントリ（このページで新しく覚えたがまだ届いていない分）が見つかれば、その場でpushする。
      try{
        const snap = await getDoc(userDocRef(user.uid));
        const data = snap.exists() ? snap.data() : {};
        const hadLocalOnly = await window.applyCloudWordsLearned(
          data.wordsLearned || {}, data.wordStats || {}, data.studyLog || {});
        if(hadLocalOnly) scheduleWordsLearnedPush();
      }catch(e){ console.error("words3000 initial cloud pull error:", e); }
    });
  }
</script>
</body>
</html>
